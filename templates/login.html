<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Compass — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon: #6b1e2e; --maroon-deep: #4a1220; --gold: #c9967a;
    --cream: #f5e8e4; --cream-dim: rgba(245,232,228,0.65);
    --text-muted: rgba(245,232,228,0.5); --darker: #110608;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: radial-gradient(ellipse at 50% 40%, #a86860 0%, #7d2438 45%, #4a1220 100%);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 40px 20px;
  }

  /* logo + brand */
  .brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 32px; }
  .brand img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; filter: drop-shadow(0 4px 16px rgba(74,18,32,0.5)); }
  .brand-name { font-family: 'Playfair Display', serif; font-style: italic; font-size: 28px; color: var(--cream); }

  /* card */
  .card {
    background: rgba(26,10,14,0.72); backdrop-filter: blur(12px);
    border: 1px solid rgba(245,232,228,0.12); border-radius: 24px;
    padding: 40px 44px; width: 100%; max-width: 420px;
  }

  /* tabs */
  .tabs { display: flex; border-bottom: 1px solid rgba(245,232,228,0.12); margin-bottom: 32px; }
  .tab-btn {
    flex: 1; background: none; border: none; color: var(--text-muted);
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    letter-spacing: 1px; text-transform: uppercase; padding: 10px 0;
    cursor: pointer; transition: color 0.2s; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* flash messages */
  .flash { padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 20px; }
  .flash.error { background: rgba(180,30,50,0.25); border: 1px solid rgba(180,30,50,0.4); color: #ffb3b3; }
  .flash.success { background: rgba(30,130,80,0.25); border: 1px solid rgba(30,130,80,0.4); color: #b3ffd6; }

  /* form */
  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  input[type="text"], input[type="password"], input[type="email"] {
    width: 100%; background: rgba(245,232,228,0.07); border: 1px solid rgba(245,232,228,0.15);
    border-radius: 12px; padding: 12px 16px; color: var(--cream); font-family: 'DM Sans', sans-serif;
    font-size: 14px; outline: none; transition: border-color 0.2s;
  }
  input:focus { border-color: rgba(201,150,122,0.5); }
  input::placeholder { color: var(--text-muted); }

  .submit-btn {
    width: 100%; background: transparent; border: 1.5px solid rgba(245,232,228,0.55);
    color: var(--cream); padding: 13px; border-radius: 32px; font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase;
    cursor: pointer; transition: background 0.25s, border-color 0.25s, transform 0.2s; margin-top: 8px;
  }
  .submit-btn:hover { background: rgba(245,232,228,0.1); border-color: var(--cream); transform: translateY(-1px); }

  .back-link { text-align: center; margin-top: 20px; }
  .back-link a { font-size: 12px; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
  .back-link a:hover { color: var(--cream-dim); }
</style>
</head>
<body>

<div class="brand">
  <img src="{{ url_for('static', filename='images/logo-transparent.png') }}" alt="CC">
  <span class="brand-name">Career Compass</span>
</div>

<div class="card">
  <div class="tabs">
    <button class="tab-btn {% if active_tab != 'register' %}active{% endif %}" onclick="showTab('login')">Login</button>
    <button class="tab-btn {% if active_tab == 'register' %}active{% endif %}" onclick="showTab('register')">Register</button>
  </div>

  <!-- LOGIN -->
  <div class="tab-panel {% if active_tab != 'register' %}active{% endif %}" id="tab-login">
    {% if login_error %}
      <div class="flash error">{{ login_error }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="form_type" value="login">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="submit-btn">Login</button>
    </form>
  </div>

  <!-- REGISTER -->
  <div class="tab-panel {% if active_tab == 'register' %}active{% endif %}" id="tab-register">
    {% if reg_error %}
      <div class="flash error">{{ reg_error }}</div>
    {% endif %}
    {% if reg_success %}
      <div class="flash success">{{ reg_success }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="form_type" value="register">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" required>
      </div>
      <div class="form-group">
        <label>Email (optional)</label>
        <input type="email" name="email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="At least 6 characters" required>
      </div>
      <button type="submit" class="submit-btn">Create Account</button>
    </form>
  </div>

  <div class="back-link"><a href="{{ url_for('index') }}">← Back to home</a></div>
</div>

<script>
  function showTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    document.querySelectorAll('.tab-btn')[name === 'login' ? 0 : 1].classList.add('active');
  }
</script>
</body>
</html>
